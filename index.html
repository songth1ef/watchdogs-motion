<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Dogs Motion Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c0d;
        --panel: #141617;
        --line: #26292b;
        --fg: #e8eaea;
        --dim: #8a9090;
        --accent: #4ff5e3;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 "Share Tech Mono", Menlo, monospace; }
      body { display: grid; grid-template-rows: 1fr auto; }
      #stage { display: grid; gap: 8px; padding: 12px 16px 0; min-height: 0; align-items: center; justify-items: center; }
      #stage.side { grid-template-columns: 1fr 1fr; }
      .view { position: relative; width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
      .view canvas, .view video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .view .label { position: absolute; left: 8px; top: 6px; font-size: 11px; color: var(--dim); background: rgba(0,0,0,.6); padding: 1px 6px; pointer-events: none; }
      #refView video { object-fit: contain; }
      #stage:not(.side) #refView { display: none; }
      #mainView video { opacity: 0; pointer-events: none; }
      #mainView.onion video { opacity: 0.5; }
      #mainView.diff video { opacity: 1; mix-blend-mode: difference; }
      #bar { display: grid; gap: 8px; padding: 10px 16px 14px; background: var(--panel); border-top: 1px solid var(--line); }
      #scrub { width: 100%; accent-color: var(--accent); }
      .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
      button, select { font: inherit; color: var(--fg); background: #1d2022; border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; }
      button:hover, select:hover { border-color: var(--accent); }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
      #time { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 15ch; }
      #scenes { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
      #rec.on { background: #c3262b; border-color: #c3262b; }
      kbd { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="view" id="mainView">
        <canvas id="out" width="1920" height="1080"></canvas>
        <video id="refOverlay" muted playsinline preload="auto"></video>
        <span class="label">复刻</span>
      </div>
      <div class="view" id="refView">
        <video id="ref" muted playsinline preload="auto"></video>
        <span class="label">原片（public/reference）</span>
      </div>
    </div>
    <div id="bar">
      <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="时间轴" />
      <div class="row">
        <select id="film" aria-label="影片"></select>
        <button id="play" title="空格">播放</button>
        <button id="prev" title="←">上一帧</button>
        <button id="next" title="→">下一帧</button>
        <span id="time">0.000s</span>
        <select id="refMode" aria-label="原片对照">
          <option value="off">对照：关</option>
          <option value="side">对照：并排</option>
          <option value="onion">对照：叠加 50%</option>
          <option value="diff">对照：差值</option>
        </select>
        <label><input id="sound" type="checkbox" /> 原片声音</label>
        <button id="rec">录制 WebM</button>
        <span id="scenes"></span>
        <kbd>空格 播放 · ←/→ 逐帧 · Shift+←/→ ±1s</kbd>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
